<div class="login-container">
  <div class="card shadow">
    <div class="card-body p-5">
      <h2 class="text-center mb-4 fw-normal">B平台 登入 login</h2>
      <form [formGroup]="accountGroup">
        <div class="mb-3">
          <label for="email" class="form-label small text-muted">帳號</label>
          <div class="position-relative">
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="輸入帳號"
              formControlName="userAccount"
            />
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label small text-muted">密碼</label>
          <div class="position-relative">
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="輸入密碼"
              formControlName="userPassword"
            />
          </div>
        </div>

        <input
          type="text"
          formControlName ="captchaInput"
          name="captcha"
          placeholder="輸入驗證碼"
          required
        />
        <img
          [src]="captchaUrl"
          (click)="refreshCaptcha()"
          alt="驗證碼圖片"
          style="cursor: pointer;margin-left: 20px;"
        />

        <button type="submit" class="btn btn-primary w-100 mb-3" style="margin-top: 20px;" (click)="VerificationCode()">登入</button>

        <div class="text-center small">
          <a (click)="register()" class="text-decoration-none" style="cursor: pointer;">註冊</a>
          <span class="mx-2">/</span>
          <a href="#" class="text-decoration-none">忘記密碼</a>
        </div>
      </form>
    </div>
  </div>
</div>
